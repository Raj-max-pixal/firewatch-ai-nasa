services:
  - type: web
    name: firewatch-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: firewatch-postgres
          property: connectionString
      - key: FIRMS_MAP_KEY
        sync: false
      - key: FIRMS_AREA
        value: 74,8,81,14
      - key: FIRMS_DAY_RANGE
        value: "10"
      - key: AUTO_INIT_DATABASE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: firewatch-postgres
    plan: free
    region: singapore
    databaseName: firewatch
    user: firewatch
    ipAllowList: []
